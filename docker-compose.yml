# The host-side port is configurable via the API_PORT environment variable
# (shell environment or a local .env file); it defaults to 8000.
#
#   API_PORT=9000 docker compose up --build
#
services:
  api:
    build: .
    image: register-linearizability-audit:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - UVICORN_LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
